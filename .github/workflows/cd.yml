name: CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: production-cd-deployment
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # 1. Environment & Secrets Validation Gate
  validate-environment:
    name: 🛡️ Validate Deployment Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_vercel_token: ${{ steps.check-secrets.outputs.has_vercel_token }}
      has_modal_token: ${{ steps.check-secrets.outputs.has_modal_token }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Audit Required Deployment Credentials
        id: check-secrets
        run: |
          echo "Auditing production deployment environment configuration..."
          
          HAS_MODAL="false"
          if [ -n "${{ secrets.MODAL_TOKEN_ID }}" ] && [ -n "${{ secrets.MODAL_TOKEN_SECRET }}" ]; then
            HAS_MODAL="true"
            echo "✅ MODAL_TOKEN credentials detected in repository secrets."
          else
            echo "ℹ️ MODAL_TOKEN_ID or MODAL_TOKEN_SECRET missing. Automated Modal deployment step will be skipped."
          fi

          HAS_VERCEL="false"
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            HAS_VERCEL="true"
            echo "✅ VERCEL_TOKEN detected in repository secrets."
          else
            echo "ℹ️ VERCEL_TOKEN missing. Vercel deployment will rely on automated GitHub App integration."
          fi

          echo "has_modal_token=$HAS_MODAL" >> "$GITHUB_OUTPUT"
          echo "has_vercel_token=$HAS_VERCEL" >> "$GITHUB_OUTPUT"

  # 2. Quality & Build Verification Gate
  build-verification:
    name: 🏗️ Quality & Build Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 📊 Evaluate Fraud Model
        run: npm run model:evaluate

      - name: 🛡️ Security Audit Gate
        run: npm run security:audit

      - name: 🔍 Type Check & Linting Gate
        run: npm run lint

      - name: 🧪 Automated Test Suite Gate
        run: npm run test

      - name: 🚀 Production Bundle Generation
        run: npm run build

      - name: 📦 Archive Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-artifacts
          path: dist/
          retention-days: 7

  # 3. Modal Serverless Backend Deployment
  deploy-modal:
    name: ⚡ Deploy Backend to Modal Serverless
    needs: [validate-environment, build-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Modal CLI
        run: pip install modal

      - name: 🚀 Deploy Backend to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ]; then
            echo "⚡ Deploying risklens-ai-backend to Modal Serverless..."
            modal deploy modal_app.py
            echo "✅ Modal backend deployed successfully."
          else
            echo "Modal deployment credentials are required for production deployment."
            exit 1
          fi

  # 4. Vercel Frontend Deployment
  deploy-vercel:
    name: 🌐 Deploy Frontend to Vercel
    needs: [validate-environment, build-verification, deploy-modal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 📦 Download Pre-verified Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-artifacts
          path: dist/

      - name: 🚀 Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "⚡ Initiating Vercel production deployment with Vercel CLI..."
            npx vercel --prod --token="$VERCEL_TOKEN" --yes
          else
            echo "ℹ️ VERCEL_TOKEN is not configured in GitHub Secrets."
            echo "   Connected repository automatic git integration will build from main: https://risklens-platform.vercel.app/"
          fi

  # 5. Live Production Health & Readiness Verification
  post-deploy-health-check:
    name: 🩺 Production Health & Readiness Verification
    needs: [deploy-modal, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🌐 Verify Live Modal API Health & Readiness
        run: |
          echo "Executing health and readiness verification against live Modal backend..."
          LIVE_URL="https://rvardhan791--risklens-ai-backend-run-server.modal.run/api/health/live"
          READY_URL="https://rvardhan791--risklens-ai-backend-run-server.modal.run/api/health/ready"
          
          echo "Probing Liveness endpoint: $LIVE_URL"
          for i in {1..6}; do
            LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$LIVE_URL" || echo "failed")
            echo "Attempt $i: Liveness HTTP status = $LIVE_STATUS"
            if [ "$LIVE_STATUS" = "200" ]; then
              echo "✅ Modal backend liveness probe succeeded."
              break
            fi
            sleep 5
          done

          echo "Probing Readiness endpoint: $READY_URL"
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$READY_URL" || echo "failed")
          echo "Readiness HTTP status = $READY_STATUS"
          if [ "$READY_STATUS" = "200" ]; then
            echo "✅ Modal backend is 100% READY and persistent database is connected."
          else
            echo "Backend readiness returned status $READY_STATUS. Deployment is not healthy."
            exit 1
          fi
