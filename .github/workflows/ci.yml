name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-and-test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: risklens_ai_test
          POSTGRES_USER: risklens_test
          POSTGRES_PASSWORD: risklens_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risklens_test -d risklens_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 Static Code Analysis & Type Check
        run: npm run lint

      - name: 🧪 Execute Autonomous Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://risklens_test:risklens_test_password@localhost:5432/risklens_ai_test
          DATA_STORE_PROVIDER: postgres
          STRICT_DATABASE: 'true'
          DATABASE_SSL: 'false'
          ALLOW_DEV_TEST_TOKENS: 'true'
          RAZORPAY_MODE: test
          RAZORPAY_WEBHOOK_SECRET: ci-test-webhook-secret
        run: npm test

      - name: 📊 Evaluate Fraud Model
        run: npm run model:evaluate

      - name: 🏗️ Execute Production Build
        run: npm run build

      - name: 🛡️ Security Vulnerability Audit
        run: npm run security:audit
