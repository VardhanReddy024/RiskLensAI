name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - staging
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  validate-and-test:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 Static Code Analysis & Type Check
        run: npm run lint

      - name: 🧪 Execute Autonomous Test Suite
        run: npm run test

      - name: 📊 Generate Code Coverage Report
        run: npm run test:coverage

      - name: 🏗️ Execute Production Build
        run: npm run build

      - name: 🛡️ Security Vulnerability Audit
        run: |
          npm audit --audit-level=high || echo "⚠️ High severity audit findings detected, please review security advisories."

      - name: 📤 Upload Test Coverage Artifacts
        if: matrix.node-version == '20.x' && always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14
